name: CI

# Install deps and syntax-check the server on every push / PR. Puppeteer's
# Chromium download is skipped — CI only parses server.js, it doesn't drive a
# browser. Build/test only — the app runs on the VPS, not from CI.
on:
  push:
  pull_request:

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax check server
        run: node --check server.js
