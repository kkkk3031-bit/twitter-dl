<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tweet Downloader</title>
<style>
  :root { --amber:#F59E0B; --bg:#0A0B0F; --card:#14161C; --line:#262A33; --txt:#E8EAED; --dim:#9AA0AB; }
  * { box-sizing:border-box; }
  /* Arabic replies render as boxes in a Latin-only stack, and Naskh needs the
     extra line-height to keep dots and marks off the line above. */
  body { margin:0; background:var(--bg); color:var(--txt);
         font:15px/1.65 system-ui,"Segoe UI","Noto Sans","Noto Naskh Arabic","Noto Sans Arabic",
              "Geeza Pro",Tahoma,Arial,"Apple Color Emoji","Noto Color Emoji",sans-serif; }
  [dir="rtl"], .rtl { font-family:"Noto Naskh Arabic","Segoe UI","Geeza Pro",Tahoma,"Noto Sans Arabic",sans-serif; line-height:1.9; }
  .wrap { max-width:720px; margin:0 auto; padding:28px 18px 60px; }
  h1 { font-size:26px; font-weight:800; margin:0 0 4px; }
  h1 span { color:var(--amber); }
  .sub { color:var(--dim); margin:0 0 20px; font-size:13px; }
  .sub b { color:var(--txt); }
  .row { display:flex; gap:8px; }
  input { flex:1; background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:12px 14px; font-size:15px; }
  input:focus { outline:none; border-color:var(--amber); }
  button { cursor:pointer; border:none; border-radius:10px; font-weight:700; font-size:14px; padding:12px 16px; }
  .go { background:var(--amber); color:#1a1204; }
  .go:disabled { opacity:.5; cursor:default; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:20px; display:none; }
  .who { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .who img { width:40px; height:40px; border-radius:50%; }
  .who .n { font-weight:700; } .who .h { color:var(--dim); font-size:13px; }
  .text { white-space:pre-wrap; font-size:16px; margin:10px 0; }
  .meta { color:var(--dim); font-size:13px; display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .imgs { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; margin:12px 0; }
  .imgs img { width:100%; border-radius:8px; border:1px solid var(--line); }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  /* the whole conversation lives on the page — no inner scrollbox to fight */
  .comments { display:none; margin-top:16px; border-top:1px solid var(--line); padding-top:12px; }
  .comments .chead { font-size:12px; color:var(--amber); font-weight:700; margin-bottom:12px; }
  /* logical padding: the bar sits at the start edge and RTL text still gets
     breathing room on the right instead of running into the card edge */
  .comments .c { border-inline-start:2px solid var(--line); padding:0 8px 0 12px; margin:0 0 16px; }
  .comments .c.op { border-inline-start-color:var(--amber); }
  .comments .c.me { border-inline-start-color:#3b4252; }
  .comments .ch { font-size:13px; font-weight:700; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .comments .ch a { color:inherit; text-decoration:none; }
  .comments .ch a:hover { color:var(--amber); }
  .comments .tag { font-size:10px; font-weight:800; letter-spacing:.04em; color:#1a1204; background:var(--amber);
                   border-radius:4px; padding:1px 5px; }
  .comments .cd { font-weight:400; font-size:11px; opacity:.55; }
  .comments .rt { font-size:11px; opacity:.5; }
  /* dir=auto per reply: an Arabic comment flips itself, an English one does not */
  .comments .ct { font-size:15px; margin:4px 0; white-space:pre-wrap; word-break:break-word;
                  overflow-wrap:anywhere; unicode-bidi:plaintext; }
  .comments .cs { font-size:11px; opacity:.6; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .comments .cs a { color:var(--amber); text-decoration:none; opacity:.85; }
  .comments .cs a:hover { text-decoration:underline; }
  .comments .cimg { max-width:140px; border-radius:8px; border:1px solid var(--line); margin-top:6px; display:block; }
  .btns button, .btns a { background:#1E2129; color:var(--txt); border:1px solid var(--line); border-radius:9px; padding:9px 13px; font-size:13px; font-weight:600; text-decoration:none; display:inline-block; }
  .btns button:hover, .btns a:hover { border-color:var(--amber); color:var(--amber); }
  .note { color:var(--dim); font-size:12.5px; margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
  .err { color:#F87171; margin-top:16px; display:none; }
  .rtl { direction:rtl; text-align:right; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span>Tweet</span> Downloader</h1>
  <p class="sub">Paste an X/Twitter link → get the <b>full text, images, video, and all info</b>. Or paste <b>TikTok</b>, <b>Instagram</b> (video <i>and</i> photos), <b>Facebook</b>, <b>Reddit</b>, <b>Vimeo</b>, <b>Twitch</b> and <a href="/api/sites" target="_blank" rel="noopener">more</a> to download the video. <span class="rtl">حمّل نص وصور وفيديو التغريدة، أو فيديو من تيك توك وإنستغرام وفيسبوك وريديت وغيرها</span></p>
  <div class="row">
    <input id="url" type="text" placeholder="x.com/user/status/123…  ·  tiktok.com/@user/video/…  ·  instagram.com/reel/…  ·  facebook.com/watch/…  ·  any video link" />
    <button class="go" id="go">Get</button>
  </div>
  <div class="err" id="err"></div>

  <div class="card" id="card">
    <div class="who" id="who"></div>
    <div class="text" id="text"></div>
    <div class="meta" id="meta"></div>
    <div class="imgs" id="imgs"></div>
    <div class="btns" id="btns"></div>
    <div id="comments" class="comments"></div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let current = null;

// Sites we hand straight to a video endpoint — there is no tweet text or image
// set to fetch first. Returns the endpoint + label, or null for an X link.
function videoSite(u) {
  let h;
  try { h = new URL(u).hostname; } catch { return null; }
  if (/(^|\.)tiktok\.com$/i.test(h)) return { api: "/api/tiktok", label: "TikTok" };
  if (/(^|\.)instagram\.com$/i.test(h)) return { api: "/api/instagram", label: "Instagram" };
  // Everything else that is not X goes to the multi-site converter, which
  // decides for itself between a direct CDN link and streaming through here.
  if (!/(^|\.)(x|twitter)\.com$/i.test(h)) return { api: "/api/convert", label: "Video" };
  return null;
}

async function go() {
  const url = $("url").value.trim();
  if (!url) return;
  $("go").disabled = true; $("go").textContent = "…";
  $("err").style.display = "none"; $("card").style.display = "none";
  const site = videoSite(url);
  if (site) {
    renderVideoSite(url, site);
    $("go").disabled = false; $("go").textContent = "Get";
    return;
  }
  try {
    comments = null; commentsVia = "";
    const cb = $("comments"); if (cb) { cb.style.display = "none"; cb.innerHTML = ""; }
    const r = await fetch("/api/fetch", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ url }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "failed");
    current = d;
    render(d);
  } catch (e) {
    $("err").textContent = e.message; $("err").style.display = "block";
  } finally {
    $("go").disabled = false; $("go").textContent = "Get";
  }
}

let comments = null, commentsVia = "";

// Replies come from a public mirror the server drives with a headless browser,
// so the first call pays that mirror's bot-check (~15s) and later ones are cached.
async function loadComments(id, btn) {
  btn.disabled = true; btn.textContent = "Loading whole thread…";
  try {
    const r = await fetch(`/api/comments?url=${encodeURIComponent("https://x.com/i/status/"+id)}`);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "failed");
    comments = d.replies; commentsVia = d.via;
    btn.textContent = `Replies ✓ ${d.count}${d.partial?"+":""}`;
    renderComments(d);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Load comments";
    $("note").innerHTML = `Couldn't load replies: ${esc(e.message)}`;
  }
}

// One entry of the conversation. `dir="auto"` lets each comment pick its own
// direction, so an Arabic reply reads right-to-left next to an English one.
function commentHTML(r, opts = {}) {
  const cls = ["c", opts.op ? "op" : "", opts.self ? "me" : ""].filter(Boolean).join(" ");
  const link = r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">open on X ↗</a>` : "";
  const to = r.replying_to && r.replying_to.length
    ? `<div class="rt">↩ ${r.replying_to.map(esc).join(" ")}</div>` : "";
  const img = r.images && r.images.length
    ? `<img class="cimg" src="${esc(r.images[0])}" loading="lazy" onerror="this.remove()"/>` : "";
  return `<div class="${cls}">
    <div class="ch">${opts.op ? `<span class="tag">TWEET</span>` : ""}` +
      `${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">@${esc(r.handle)}</a>` : `@${esc(r.handle)}`}` +
      `${r.name ? `<span class="cd">${esc(r.name)}</span>` : ""}` +
      `<span class="cd">${esc(r.date||"")}</span></div>
    ${to}
    <div class="ct" dir="auto">${esc(r.text||"")}</div>
    ${img}
    <div class="cs"><span>❤ ${r.likes??0}</span>${r.retweets?`<span>🔁 ${r.retweets}</span>`:""}` +
      `${r.replies?`<span>💬 ${r.replies}</span>`:""}${r.images&&r.images.length>1?`<span>🖼 ${r.images.length}</span>`:""}${link}</div>
  </div>`;
}

function renderComments(d) {
  const box = $("comments");
  const op = d.main ? commentHTML(d.main, { op: true }) : "";
  const author = d.main?.handle;
  box.innerHTML =
    `<div class="chead">Whole conversation · ${d.count} replies${d.partial?" (capped — huge thread)":""} · ` +
    `oldest → newest · via ${esc(d.via)} · no login</div>` +
    op +
    d.replies.map(r => commentHTML(r, { self: author && r.handle === author })).join("");
  box.style.display = "block";
}

// Notepad and most Android text viewers guess the encoding: a UTF-8 file with
// no BOM is read as ANSI, so emoji and Arabic come out as mojibake, and LF-only
// newlines collapse the whole thing onto one line. Text files therefore ship
// with a BOM and CRLF; JSON must not (a BOM breaks strict parsers).
function download(name, text, type="text/plain") {
  const isJson = /json/.test(type) || /\.json$/i.test(name);
  const body = isJson ? text : "﻿" + String(text).replace(/\r?\n/g, "\r\n");
  const b = new Blob([body], { type: `${type};charset=utf-8` });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}

function markdown(d) {
  let m = `# Tweet by @${d.author?.handle||"?"} (${d.author?.name||""})\n\n`;
  m += `- URL: https://x.com/i/status/${d.id}\n- Posted: ${d.created_at||"?"}\n`;
  m += `- Likes: ${d.stats?.likes??"?"} · Thread: ${d.stats?.retweets??"?"}\n`;
  m += `- Images: ${d.images.length} · Video: ${d.has_video?"yes":"no"}\n\n## Text\n\n${d.text||"(none)"}\n`;
  if (d.images.length) m += `\n## Image URLs\n\n` + d.images.map(u=>`- ${u}?name=orig`).join("\n") + "\n";
  m += `\n## Comments / replies\n\n`;
  if (comments && comments.length) {
    m += `_${comments.length} replies (whole thread) via ${commentsVia||"public mirror"}, no login_\n\n`;
    m += comments.map(r =>
      `- **@${r.handle}**${r.date?` · ${r.date}`:""}` +
      `${r.replying_to&&r.replying_to.length?` ↩ ${r.replying_to.join(" ")}`:""}` +
      ` (❤${r.likes??0}${r.retweets?` 🔁${r.retweets}`:""}${r.replies?` 💬${r.replies}`:""}): ` +
      `${(r.text||"").replace(/\n/g," ")}` +
      `${r.url?`\n  ${r.url}`:""}`).join("\n") + "\n";
  } else {
    m += `_Press "Load comments" first to include the reply thread._\n`;
  }
  return m;
}

function renderVideoSite(url, site) {
  $("who").innerHTML = "";
  $("text").textContent = site.label + " video";
  $("meta").innerHTML = "";
  $("imgs").innerHTML = "";
  $("btns").innerHTML = `<a href="${site.api}?url=${encodeURIComponent(url)}">Download video</a>`;
  $("note").innerHTML = `The MP4 is fetched server-side, so it can take a few seconds to start. Private, removed, or region-locked videos can't be downloaded, and photo-only posts have nothing to save. <span class="rtl">قد يستغرق التحميل بضع ثوانٍ</span>`;
  $("card").style.display = "block";
}

function render(d) {
  $("who").innerHTML = d.author
    ? `<img src="${d.author.avatar||""}" onerror="this.style.display='none'"/><div><div class="n">${esc(d.author.name||"")}</div><div class="h">@${esc(d.author.handle||"")}</div></div>`
    : "";
  $("text").textContent = d.text || "(no text)";
  const dt = d.created_at ? new Date(d.created_at).toLocaleString() : "?";
  $("meta").innerHTML = `<span>❤ ${d.stats?.likes??"?"}</span><span>💬 ${d.stats?.replies??d.stats?.retweets??"?"}</span><span>🕐 ${dt}</span>`;
  $("imgs").innerHTML = d.images.map(u=>`<img src="${esc(u)}?name=small" loading="lazy"/>`).join("");
  const b = [];
  b.push(`<button onclick="navigator.clipboard.writeText(current.text||'');this.textContent='Copied ✓'">Copy text</button>`);
  b.push(`<button onclick="download('tweet-${d.id}.txt', current.text||'')">Text .txt</button>`);
  b.push(`<button onclick="download('tweet-${d.id}.md', markdown(current))">AI markdown</button>`);
  b.push(`<button onclick="download('tweet-${d.id}.json', JSON.stringify(current.raw,null,2),'application/json')">All info .json</button>`);
  b.push(`<button onclick="loadComments('${d.id}', this)">Load comments</button>`);
  d.images.forEach((u,i)=> b.push(`<a href="/api/image?u=${encodeURIComponent(u)}">Image ${i+1}</a>`));
  if (d.has_video) b.push(`<a href="/api/video?url=${encodeURIComponent('https://x.com/i/status/'+d.id)}">Download video</a>`);
  $("btns").innerHTML = b.join("");
  $("note").innerHTML = `<b>Load comments</b> walks the <b>whole</b> reply tree — every sub-thread, no X login, no cookies (a few seconds, then instant). <b>AI markdown</b> gives a clean file for Claude, replies included. <span class="rtl">التعليقات بدون تسجيل دخول</span>`;
  $("card").style.display = "block";
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
$("go").onclick = go;
$("url").addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
</script>
</body>
</html>
